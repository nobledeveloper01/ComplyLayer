name: release

# One tag, both packages. The Python package and the Node SDK are versioned
# together and released from the same tag, so a customer never has to work out
# which client version speaks to which server.
#
# **Every action is pinned to a commit, not a tag or a branch.** A tag can be
# moved and a branch moves by definition; `aquasecurity/trivy-action@master` was
# tracking a moving branch inside the one job holding `packages: write` and a
# Sigstore signing identity. A commit landing upstream would have had the run
# push a backdoored image to ghcr and sign it with this project's own identity,
# so provenance and signature verification would both have passed for everyone
# downstream. Bumps come through Dependabot (.github/dependabot.yml) as pull
# requests somebody reads.
on:
  push:
    tags: ["v*"]
  # Rehearse the whole pipeline without releasing anything.
  #
  # **A dispatch is always a dry run.** There is deliberately no "publish"
  # input: a checkbox that can be ticked into an irreversible PyPI or npm upload
  # is a footgun, and a dispatch has no tag, so anything it published would be a
  # version that corresponds to nothing. Publishing is gated on
  # `github.event_name == 'push'` at every step that uploads, signs or logs in,
  # which makes "released from a tag" structural rather than procedural.
  #
  # This exists because `release.yml` only ever runs on a tag, so its actions —
  # setup-node, build-push-action, setup-buildx — were bumped across major
  # versions with nothing exercising them until the next release. A pipeline
  # nobody can rehearse is a pipeline that is first tested by needing it.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # trusted publishing: no long-lived token in the repository

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: complylayer
          POSTGRES_USER: complylayer
          POSTGRES_PASSWORD: complylayer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U complylayer"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      COMPLYLAYER_DB_HOST: 127.0.0.1
      COMPLYLAYER_REDIS_URL: redis://127.0.0.1:6379/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.26", enable-cache: true }
      - run: uv sync --frozen

      # A tag does not get to skip the gates. Everything a pull request must
      # pass, a release must pass again — on the exact commit being published.
      - run: uv run python scripts/no_eval_guard.py
      - run: uv run pytest -m "not benchmark" --cov=complylayer

      - name: the tag matches the packaged version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY=$(uv run python -c "import complylayer; print(complylayer.__version__)")
          NODE=$(node -p "require('./sdk/node/package.json').version")
          echo "tag=$TAG python=$PY node=$NODE"
          test "$TAG" = "$PY" || { echo "::error::tag $TAG does not match complylayer $PY"; exit 1; }
          test "$TAG" = "$NODE" || { echo "::error::tag $TAG does not match the SDK $NODE"; exit 1; }

      # On a dispatch there is no tag to match, so the assertion above is
      # meaningless — `GITHUB_REF_NAME` is a branch. The half that still means
      # something is that the two packages agree with each other, which is the
      # thing a release would otherwise discover at the worst moment.
      - name: the two packages agree on a version
        if: github.event_name != 'push'
        run: |
          PY=$(uv run python -c "import complylayer; print(complylayer.__version__)")
          NODE=$(node -p "require('./sdk/node/package.json').version")
          echo "python=$PY node=$NODE (dry run: no tag to compare against)"
          test "$PY" = "$NODE" || {
            echo "::error::complylayer $PY and the SDK $NODE disagree; a tag cannot match both"
            exit 1
          }

  python:
    name: pypi
    needs: verify
    runs-on: ubuntu-latest
    # No environment unless this run actually publishes: the release environment
    # holds the publishing credentials, and a run that does not publish has no
    # business requesting them — or waiting on whatever approval guards them.
    # That covers both a rehearsal and a tag whose registry is not wired up yet.
    environment: ${{ github.event_name == 'push' && vars.PUBLISH_PYPI == 'true' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.26" }
      - run: uv build
      # The wheel must carry the templates and CSS, or `pip install complylayer`
      # gives a dashboard with no dashboard — and the failure appears at first
      # request rather than at install.
      - name: the wheel carries the dashboard
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'complylayer/templates/complylayer/builder.html'
          python -m zipfile -l dist/*.whl | grep -q 'complylayer/static/complylayer/tokens.css'
      # Publishing is opt-in per registry, and off until the registry is wired up.
      #
      # PyPI cannot be uploaded to until somebody has configured a trusted
      # publisher there, and until then a tag would fail this job on a credential
      # that was never set up. A release that goes red for a reason nobody can
      # act on from the repository teaches people to ignore red releases — the
      # same failure mode that nearly cost this project its CVE gate.
      #
      # So the tag still cuts a release; this registry simply is not part of it
      # yet, and says so. Turn it on once the publisher exists:
      #
      #   gh variable set PUBLISH_PYPI --body true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: github.event_name == 'push' && vars.PUBLISH_PYPI == 'true'

      - name: what this run did not upload
        if: github.event_name != 'push' || vars.PUBLISH_PYPI != 'true'
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "dry run — the wheel built and was checked, and was not uploaded to PyPI"
          else
            echo "::notice::PUBLISH_PYPI is not set: the wheel built and was checked, and was not uploaded."
            echo "The tag still released the image. To add PyPI, configure a trusted publisher"
            echo "for 'complylayer' (workflow release.yml, environment release), then:"
            echo "  gh variable set PUBLISH_PYPI --body true"
          fi

  node:
    name: npm
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && vars.PUBLISH_NPM == 'true' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        # 22, not 20: Node 20 is past end of life, and publishing from an
        # unsupported runtime means security fixes stop reaching the thing that
        # signs and uploads the package.
        #
        # The SDK still declares `engines: >=20`, so this tests one version
        # above its own floor. That is deliberate but not free — nothing here
        # verifies the 20 claim any more. If that matters, the fix is a matrix
        # over 20 and 22 rather than moving the floor, because dropping Node 20
        # support is a decision about customers rather than about CI.
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: node --test sdk/node/src/index.test.js
      # Same switch as PyPI, and here the missing piece is concrete: the package
      # is scoped, so it needs an npm organisation to exist as well as a token.
      #
      #   gh secret set NPM_TOKEN && gh variable set PUBLISH_NPM --body true
      - run: npm publish --provenance --access public
        if: github.event_name == 'push' && vars.PUBLISH_NPM == 'true'
        working-directory: sdk/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `--dry-run` packs the tarball and prints exactly what would ship without
      # contacting the registry, which is the half of publishing that has ever
      # actually been wrong here: the `files` list.
      - run: npm publish --dry-run --access public
        if: github.event_name != 'push' || vars.PUBLISH_NPM != 'true'
        working-directory: sdk/node

      - name: what this run did not upload
        if: github.event_name == 'push' && vars.PUBLISH_NPM != 'true'
        run: |
          echo "::notice::PUBLISH_NPM is not set: the tarball was packed and checked, and was not uploaded."
          echo "The tag still released the image. To add npm, create the 'complylayer' org, then:"
          echo "  gh secret set NPM_TOKEN && gh variable set PUBLISH_NPM --body true"

  image:
    name: image
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # Not even a login on a dry run. `packages: write` is granted to this job
      # and a rehearsal has no reason to hold a registry session, so the
      # credential is never exchanged in the first place.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `push` and `load` are the switch. On a tag the image goes to ghcr; on a
      # dispatch it is loaded into the local daemon under a throwaway tag, so
      # trivy still has something real to scan and nothing leaves the runner.
      # The image reference, computed once and used by every step below.
      #
      # `github.repository` is `nobledeveloper01/ComplyLayer`, and a registry
      # requires a lowercase repository name — so v0.1.0's first tag failed here
      # with `invalid tag: repository name must be lowercase`, after four green
      # rehearsals. The rehearsals could not have caught it: a dispatch built a
      # throwaway `complylayer:dry-run`, so the reference itself was the one part
      # of a release the rehearsal did not rehearse.
      #
      # Both paths now build the same string through the same lowercasing and
      # differ only in the tag, which is what makes a dispatch able to fail on
      # this at all.
      - name: the image reference
        id: ref
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          TAG="${{ github.event_name == 'push' && github.ref_name || 'dry-run' }}"
          echo "repo=ghcr.io/$REPO" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$REPO:$TAG" >> "$GITHUB_OUTPUT"
          echo "this run builds ghcr.io/$REPO:$TAG"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.ref.outputs.image }}
          provenance: ${{ github.event_name == 'push' }}
          sbom: ${{ github.event_name == 'push' }}

      # Two scans, because one number was answering two different questions.
      #
      # **The blocking one ignores unfixed CVEs.** The first dry run failed here
      # on 34 findings — 28 HIGH, 6 CRITICAL — and every single one had an empty
      # Fixed Version: `affected`, `fix_deferred` or `will_not_fix` in Debian's
      # tracker. The base image already tracks the current `bookworm-slim`, so
      # there was no version to move to and nothing anybody could have done
      # except stop releasing.
      #
      # A gate that cannot be satisfied is a gate that gets deleted, which is how
      # this project lost a latency assertion earlier. So this one fails on what
      # is actionable: a HIGH or CRITICAL with a patch available blocks the
      # release, and rightly.
      - name: trivy (blocking — anything with a fix available)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # And the unfixed ones stay visible rather than being silently dropped.
      # Ignoring a CVE in the gate is a statement that it cannot be acted on
      # today, not that it does not exist — somebody reading a release log should
      # still see what is riding along in the base image.
      - name: trivy (reporting — including what has no fix yet)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          exit-code: "0"
          ignore-unfixed: false
          severity: HIGH,CRITICAL

      # The rehearsal's real question: does the thing start? CI already smokes
      # the image on every commit, and repeating it here means a dry run
      # exercises the release build rather than only proving it compiles.
      - name: the release image serves /healthz
        if: github.event_name != 'push'
        run: |
          docker run -d --name cl-release-smoke -p 8000:8000 \
            -e COMPLYLAYER_DB_HOST=127.0.0.1 \
            -e COMPLYLAYER_SECRET_KEY="${{ github.sha }}-dry-run-only" \
            -e COMPLYLAYER_CUSTOMER_SALT="${{ github.sha }}-dry-run-salt" \
            ${{ steps.ref.outputs.image }}
          for _ in $(seq 1 30); do
            if curl -fs localhost:8000/healthz >/dev/null 2>&1; then
              echo "the release image serves /healthz"; docker rm -f cl-release-smoke; exit 0
            fi
            sleep 1
          done
          echo "::error::the release image never answered /healthz"
          docker logs cl-release-smoke; docker rm -f cl-release-smoke; exit 1

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: github.event_name == 'push'
      - name: sign
        if: github.event_name == 'push'
        run: cosign sign --yes ${{ steps.ref.outputs.repo }}@${{ steps.build.outputs.digest }}

      - name: what a dry run skipped
        if: github.event_name != 'push'
        run: |
          echo "dry run — built, scanned and started the image locally."
          echo "Not done: pushed to ghcr, generated provenance or an SBOM, signed with cosign."
