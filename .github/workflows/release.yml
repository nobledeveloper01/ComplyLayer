name: release

# One tag, both packages. The Python package and the Node SDK are versioned
# together and released from the same tag, so a customer never has to work out
# which client version speaks to which server.
#
# **Every action is pinned to a commit, not a tag or a branch.** A tag can be
# moved and a branch moves by definition; `aquasecurity/trivy-action@master` was
# tracking a moving branch inside the one job holding `packages: write` and a
# Sigstore signing identity. A commit landing upstream would have had the run
# push a backdoored image to ghcr and sign it with this project's own identity,
# so provenance and signature verification would both have passed for everyone
# downstream. Bumps come through Dependabot (.github/dependabot.yml) as pull
# requests somebody reads.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # trusted publishing: no long-lived token in the repository

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: complylayer
          POSTGRES_USER: complylayer
          POSTGRES_PASSWORD: complylayer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U complylayer"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      COMPLYLAYER_DB_HOST: 127.0.0.1
      COMPLYLAYER_REDIS_URL: redis://127.0.0.1:6379/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.26", enable-cache: true }
      - run: uv sync --frozen

      # A tag does not get to skip the gates. Everything a pull request must
      # pass, a release must pass again — on the exact commit being published.
      - run: uv run python scripts/no_eval_guard.py
      - run: uv run pytest -m "not benchmark" --cov=complylayer

      - name: the tag matches the packaged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY=$(uv run python -c "import complylayer; print(complylayer.__version__)")
          NODE=$(node -p "require('./sdk/node/package.json').version")
          echo "tag=$TAG python=$PY node=$NODE"
          test "$TAG" = "$PY" || { echo "::error::tag $TAG does not match complylayer $PY"; exit 1; }
          test "$TAG" = "$NODE" || { echo "::error::tag $TAG does not match the SDK $NODE"; exit 1; }

  python:
    name: pypi
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.26" }
      - run: uv build
      # The wheel must carry the templates and CSS, or `pip install complylayer`
      # gives a dashboard with no dashboard — and the failure appears at first
      # request rather than at install.
      - name: the wheel carries the dashboard
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'complylayer/templates/complylayer/builder.html'
          python -m zipfile -l dist/*.whl | grep -q 'complylayer/static/complylayer/tokens.css'
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  node:
    name: npm
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20", registry-url: "https://registry.npmjs.org" }
      - run: node --test sdk/node/src/index.test.js
      - run: npm publish --provenance --access public
        working-directory: sdk/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  image:
    name: image
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          exit-code: "1"
          severity: HIGH,CRITICAL

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: sign
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
