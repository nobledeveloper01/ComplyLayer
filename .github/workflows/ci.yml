name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_VERSION: "0.11.26"

jobs:
  # Deliberately first, and deliberately alone. If the sandbox is broken then
  # nothing else in this pipeline matters, and a reviewer glancing at a red
  # build should see that immediately rather than scrolling past a lint failure.
  security-first:
    name: sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen

      - name: eval/exec guard (ADR-0001)
        run: uv run python scripts/no_eval_guard.py

      # Phase 1 fills these in. They are wired now, failing loudly if the files
      # go missing, so that the day the DSL lands there is nowhere for it to
      # land un-gated.
      - name: escape corpus
        run: |
          if [ -f tests/test_dsl_escapes.py ]; then
            uv run pytest tests/test_dsl_escapes.py -x
          else
            echo "::notice::escape corpus not written yet — phase 1"
          fi

      - name: DSL limits
        run: |
          if [ -f tests/test_dsl_limits.py ]; then
            uv run pytest tests/test_dsl_limits.py
          else
            echo "::notice::DSL limit tests not written yet — phase 1"
          fi

  quality:
    name: quality
    runs-on: ubuntu-latest

    # Postgres and Redis are services here rather than mocks because the things
    # this job has to prove are properties of the real ones: that the decisions
    # table is genuinely partitioned, that the audit trigger genuinely refuses an
    # UPDATE, and that tenant isolation genuinely returns nothing. A fake would
    # only ever confirm the fake.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: complylayer
          POSTGRES_USER: complylayer
          POSTGRES_PASSWORD: complylayer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U complylayer"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20

    env:
      COMPLYLAYER_DB_HOST: 127.0.0.1
      COMPLYLAYER_DB_PORT: "5432"
      COMPLYLAYER_REDIS_URL: redis://127.0.0.1:6379/2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen

      - name: README is current with PHASE
        run: ./scripts/check-readme-phase.sh

      - name: lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: tests with coverage gate
        run: uv run pytest -m "not benchmark" --cov=complylayer --cov-report=term-missing

      - name: migrations are committed
        run: uv run python manage.py makemigrations --check --dry-run

      # Both workloads, at WARNING, with every silence documented in the
      # settings module that sets it. This was never run, which is how the
      # dashboard reached phase 8 with no clickjacking protection on a page
      # whose main control is an Approve button, and how the session cookie kept
      # its four hardening flags and not the fifth.
      #
      # Real secrets rather than the published defaults: the point of the gate
      # is the checks after that one, and `server/boot.py` already refuses the
      # defaults at startup.
      - name: deployment checks, both workloads
        env:
          COMPLYLAYER_SECRET_KEY: ${{ github.sha }}-ci-only-not-a-real-deployment-key
          COMPLYLAYER_CUSTOMER_SALT: ${{ github.sha }}-ci-only-salt
        run: |
          uv run python manage.py check --deploy --fail-level WARNING
          DJANGO_SETTINGS_MODULE=server.settings_management \
            uv run python manage.py check --deploy --fail-level WARNING

      # Phase 5 and phase 2 respectively. Wired now for the same reason as above.
      - name: tenant isolation
        run: |
          if [ -f tests/test_tenant_isolation.py ]; then
            uv run pytest tests/test_tenant_isolation.py
          else
            echo "::notice::tenant isolation suite not written yet — phase 5"
          fi

      - name: determinism
        run: |
          if [ -f tests/test_determinism.py ]; then
            uv run pytest tests/test_determinism.py
          else
            echo "::notice::determinism suite not written yet — phase 2"
          fi

  latency:
    name: latency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen

      # Only the evaluation stage is asserted here: pure CPU, no I/O, stable on
      # a shared runner. End-to-end p99 runs nightly on dedicated hardware,
      # because a p99 assertion on a noisy runner flakes, and a flaky blocking
      # gate gets commented out within a month. See phase 4 in docs/ROADMAP.md.
      - name: evaluation stage benchmark
        run: |
          if [ -f tests/test_latency_benchmark.py ]; then
            uv run pytest tests/test_latency_benchmark.py
          else
            echo "::notice::latency benchmark not written yet — phase 4"
          fi

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen

      - run: uv run bandit -q -c pyproject.toml -r complylayer/

      # Pinned rulesets, not `--config auto`. Auto resolves against semgrep.dev
      # at run time, so the gate changed underneath a green commit: the same
      # tree that passed produced five findings a fortnight later, and a run
      # that cannot reach the network passes by finding nothing. A security gate
      # whose result depends on the day is not a gate. These packs are explicit
      # and diffable; bumping them is a pull request.
      #
      # django-no-csrf-token is excluded because it is wrong here. It flags
      # sign_in.html and verify.html and not the four templates written
      # identically beside them, all six carry `{% csrf_token %}`, and neither a
      # template comment nor an HTML comment suppresses it. That the control is
      # real is asserted instead by
      # tests/test_dashboard.py::TestCsrfIsEnforcedOnTheSignInForms, which
      # renders the forms and posts without a token.
      - name: semgrep
        run: |
          uv run semgrep --error --quiet complylayer/ \
            --config p/python --config p/django --config p/secrets \
            --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token

      - run: uv run pip-audit --skip-editable

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build
    needs: [security-first, quality, latency, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Built on every change, not only at a tag. The entrypoint shipped without
      # gunicorn in its dependencies because nothing ever built the image — an
      # image nobody builds is an image that does not build.
      - name: build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: complylayer:ci

      # And a build that succeeds still proves nothing about whether the thing
      # starts. This runs the real entrypoint and waits for the port.
      #
      # Both secrets are set because `server/boot.py` refuses to start on the
      # published defaults, and this step is where that refusal was first seen
      # working: it had `COMPLYLAYER_SECRET_KEY` and not the salt, and the
      # container correctly declined to serve. Keeping real-looking values here
      # rather than relaxing the refusal — a smoke test that needs the guard
      # turned off is not testing the thing that ships.
      - name: the entrypoint actually starts
        run: |
          docker run -d --name cl-smoke -p 8000:8000 \
            -e COMPLYLAYER_DB_HOST=127.0.0.1 \
            -e COMPLYLAYER_SECRET_KEY="${{ github.sha }}-ci-only-not-a-real-key" \
            -e COMPLYLAYER_CUSTOMER_SALT="${{ github.sha }}-ci-only-salt" \
            complylayer:ci
          for i in $(seq 1 30); do
            if curl -fs localhost:8000/healthz >/dev/null 2>&1; then
              echo "the container serves /healthz"; docker rm -f cl-smoke; exit 0
            fi
            sleep 1
          done
          echo "::error::the container never answered /healthz"
          docker logs cl-smoke; docker rm -f cl-smoke; exit 1
