name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_VERSION: "0.11.26"

jobs:
  # Deliberately first, and deliberately alone. If the sandbox is broken then
  # nothing else in this pipeline matters, and a reviewer glancing at a red
  # build should see that immediately rather than scrolling past a lint failure.
  security-first:
    name: sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen

      - name: eval/exec guard (ADR-0001)
        run: uv run python scripts/no_eval_guard.py

      # Phase 1 fills these in. They are wired now, failing loudly if the files
      # go missing, so that the day the DSL lands there is nowhere for it to
      # land un-gated.
      - name: escape corpus
        run: |
          if [ -f tests/test_dsl_escapes.py ]; then
            uv run pytest tests/test_dsl_escapes.py -x
          else
            echo "::notice::escape corpus not written yet — phase 1"
          fi

      - name: DSL limits
        run: |
          if [ -f tests/test_dsl_limits.py ]; then
            uv run pytest tests/test_dsl_limits.py
          else
            echo "::notice::DSL limit tests not written yet — phase 1"
          fi

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen

      - name: README is current with PHASE
        run: ./scripts/check-readme-phase.sh

      - name: lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: tests with coverage gate
        run: uv run pytest -m "not integration" --cov=complylayer --cov-report=term-missing

      - name: migrations are committed
        run: uv run python manage.py makemigrations --check --dry-run

      # Phase 5 and phase 2 respectively. Wired now for the same reason as above.
      - name: tenant isolation
        run: |
          if [ -f tests/test_tenant_isolation.py ]; then
            uv run pytest tests/test_tenant_isolation.py
          else
            echo "::notice::tenant isolation suite not written yet — phase 5"
          fi

      - name: determinism
        run: |
          if [ -f tests/test_determinism.py ]; then
            uv run pytest tests/test_determinism.py
          else
            echo "::notice::determinism suite not written yet — phase 2"
          fi

  latency:
    name: latency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen

      # Only the evaluation stage is asserted here: pure CPU, no I/O, stable on
      # a shared runner. End-to-end p99 runs nightly on dedicated hardware,
      # because a p99 assertion on a noisy runner flakes, and a flaky blocking
      # gate gets commented out within a month. See phase 4 in docs/ROADMAP.md.
      - name: evaluation stage benchmark
        run: |
          if [ -f tests/test_latency_benchmark.py ]; then
            uv run pytest tests/test_latency_benchmark.py
          else
            echo "::notice::latency benchmark not written yet — phase 4"
          fi

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen

      - run: uv run bandit -q -c pyproject.toml -r complylayer/
      - run: uv run semgrep --config auto --error --quiet complylayer/
      - run: uv run pip-audit --skip-editable

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build
    needs: [security-first, quality, latency, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phase 8 adds the image build, trivy scan and cosign signature. Until
      # there is something to serve there is nothing to containerise, and a
      # placeholder Dockerfile would only rot.
      - name: placeholder
        run: echo "::notice::image build, trivy and cosign land in phase 8"
