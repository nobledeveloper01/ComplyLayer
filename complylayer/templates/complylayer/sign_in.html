<!doctype html>
<html lang="en" data-theme="{{ request.COOKIES.complylayer_theme|default:'' }}"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — ComplyLayer</title>
  {% load static complylayer_static %}
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="{% static_v 'complylayer/fonts/geist-variable.woff2' %}">
  <link rel="stylesheet" href="{% static_v 'complylayer/tokens.css' %}">
  <link rel="stylesheet" href="{% static_v 'complylayer/dashboard.css' %}">
</head><body>
<div class="auth">
  <div class="auth__panel">
    <h1 class="auth__title">Sign in</h1>
    <p class="auth__intro">Review and change the rules that decide whether money moves.</p>

    {% if error %}<div class="rule-error"><div class="rule-error__problem">{{ error }}</div></div>{% endif %}

    <form class="auth__form" method="post">
      {% csrf_token %}
      <div class="field">
        <label class="field__label" for="email">Email address</label>
        <input class="field__input" id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label class="field__label" for="password">Password</label>
        <input class="field__input" id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>
      <button class="button" type="submit">Continue</button>
    </form>
  </div>
  <div class="auth__mark">ComplyLayer</div>
</div>
</body></html>
