[project]
name = "complylayer"
version = "0.0.0"
description = "Pluggable compliance rules and decision engine for fintechs"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "BUSL-1.1" }
authors = [{ name = "ComplyLayer" }]
keywords = ["compliance", "fintech", "aml", "kyc", "rules-engine"]

dependencies = [
    "django>=5.0,<6.0",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "orjson>=3.10",
    "argon2-cffi>=23.1",
    "djangorestframework>=3.15",
    "pyotp>=2.9",
    "gunicorn>=23.0",
    "uvicorn>=0.34",
]

[project.urls]
Repository = "https://github.com/nobledeveloper01/ComplyLayer"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "semgrep>=1.100",
    "pre-commit>=4.0",
    # Phase 1 needs it for the DSL property tests; installed now so the lock
    # file does not churn the moment the sandbox work starts.
    "hypothesis>=6.122",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["complylayer"]
# Templates and CSS are part of the package, not build artefacts. Without this
# `pip install complylayer` installs a dashboard with no dashboard — and the
# failure appears at first request rather than at install.
artifacts = ["complylayer/templates/**", "complylayer/static/**"]

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
# `ruff format` rewrites Python code blocks inside markdown. The specification
# and the plans are documents of record, and their code samples are quoted to be
# read rather than run — reformatting them produces a diff nobody asked for and
# makes the spec disagree with itself across revisions.
extend-exclude = ["migrations", "docs"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "S",         # bandit-alikes, so the obvious ones fail at lint speed
    "DTZ",       # naive datetimes — a compliance product cannot afford them
    "T20",       # no stray print()
    "RUF",
]
ignore = [
    "S101",      # assert is how the tests are written
    # Telemetry must never break a decision, and on a path running 2,000 times a
    # second a logged exception per failure buries the records that matter. The
    # two sites that swallow are in complylayer/engine/metrics.py and each says
    # why in a comment.
    "S110",
]

[tool.ruff.lint.per-file-ignores]
# The escape corpus is deliberately full of hostile strings — including
# homoglyphs, which RUF001 flags as ambiguous. That is precisely why they are
# there: the payload IS the ambiguity.
"tests/test_dsl_escapes.py" = ["S", "E501", "RUF001"]
# The doctor and the standalone scripts print for a living.
"complylayer/management/commands/*" = ["T20"]
"scripts/*" = ["T20"]
# Django Meta options (indexes, constraints, unique_together) are lists by
# convention, which RUF012 reads as a mutable class attribute.
"complylayer/models.py" = ["RUF012"]
# DRF Meta options (fields, read_only_fields) are lists by convention, same as
# Django's.
"complylayer/api/management/*" = ["RUF012"]
# The multiplication sign is deliberate: "10x higher" reads as a variable name,
# "10x higher" with a real multiplication sign reads as a magnitude — which is
# the whole point of the approval diff.
"complylayer/dashboard/diff.py" = ["RUF001", "RUF002"]
# A test password is a test password.
"tests/test_dashboard.py" = ["S603", "S105", "S106", "RUF001", "RUF002", "RUF012"]
# Tests shell out to the guard scripts on purpose, with arguments they construct
# themselves.
"tests/*" = ["S603", "RUF012"]
# The benchmark reports numbers to a human reading the terminal. That is its
# entire output.
"tests/test_decision_benchmark.py" = ["S603", "T201"]
"tests/test_latency_benchmark.py" = ["S603", "T201"]
# Same: the benchmark class in here prints the auth cost, which is the number
# the always-read-the-row tradeoff rests on.
"tests/test_api_key_auth.py" = ["T201"]
# A fuzzer wants a seeded, reproducible pseudo-random generator. A failure that
# cannot be replayed is a failure nobody fixes, so `random.Random(seed)` is the
# correct choice here rather than a weakness.
"tests/test_dsl_fuzz.py" = ["S603", "S311", "RUF005"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "server.settings"
testpaths = ["tests"]
# The guard scripts live outside the package but are still tested like code.
pythonpath = ["scripts"]
addopts = "-q --strict-markers"
markers = [
    # Anything needing a live Postgres or Redis. `make test` excludes these so
    # a clean checkout can run the suite without docker; `make test-integration`
    # includes them.
    "integration: requires Postgres and Redis",
    # Timing on a shared runner is noise, and a flaky blocking gate is one
    # somebody eventually comments out. Run with `make bench`.
    "benchmark: timing measurements, excluded from the default run",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["complylayer"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B608 flags string-built SQL. Every instance in this project is DDL — creating a
# partition, creating a role — where Postgres accepts no placeholder for an
# identifier. Each site validates its identifier against a pattern first
# (`complylayer/partitions.py::_identifier`) or uses a module constant. Reviewed
# rather than silenced blindly: if a query ever interpolates a *value*, it will
# not be one of these files.
skips = ["B608"]
